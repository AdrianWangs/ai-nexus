<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Nexus WebUI</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">AI‑Nexus</div>
        <button id="new-session-btn" class="btn btn-primary">新对话</button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-footer">
        <span id="agent-count">0</span> 个 Agent 在线
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div id="chat-title" class="chat-title">选择或创建对话</div>
        <button id="toggle-agents-btn" class="btn btn-icon">Agent</button>
      </header>

      <div class="content">
        <div id="messages" class="messages"></div>
      </div>

      <footer class="composer">
        <div id="mention-popup" class="mention-popup"></div>
        <textarea id="message-input" rows="1" placeholder="输入消息… 使用 @ 提及 Agent" disabled></textarea>
        <button id="send-btn" class="btn btn-send" disabled>发送</button>
      </footer>
    </main>

    <aside id="agent-panel" class="agent-panel">
      <div class="panel-header">
        <div>Agent 列表</div>
        <button id="close-panel-btn" class="btn btn-icon">关闭</button>
      </div>
      <div id="agent-list" class="agent-list"></div>
    </aside>
  </div>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
